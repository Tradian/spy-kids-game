<title>Little Agents — Spy Academy</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  :root {
    --bg-deep: #141B33;
    --bg-panel: #1E2A4A;
    --bg-raised: #2A3A63;
    --outline: #3D5087;
    --gold: #FFC94D;
    --gold-deep: #E8A013;
    --mint: #5DE0A1;
    --coral: #FF7B6B;
    --sky: #6BC5FF;
    --lilac: #B79CFF;
    --text-bright: #FFFFFF;
    --text-soft: #AAB7DA;
    --text-on-gold: #3A2A00;
    --scroll-bg: #2E2338;
    --scroll-panel: #3D2F4A;
    --parchment: #F4E3BE;
    --parchment-ink: #4A3520;
    --round-stack: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0B1024;
    font-family: var(--round-stack);
    color: var(--text-bright);
    overscroll-behavior: none;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg-deep);
    position: relative;
    overflow: hidden;
    transition: background 0.4s;
  }
  #app.scroll-world { background: var(--scroll-bg); }

  /* ---------- shared chrome ---------- */
  .header {
    display: flex;
    align-items: center;
    padding: 10px 8px 4px;
    min-height: 58px;
  }
  .back-btn {
    width: 64px; height: 56px;
    border: none; background: none;
    font-size: 26px; cursor: pointer;
    color: var(--text-bright);
    border-radius: 999px;
  }
  .header-title {
    flex: 1;
    text-align: center;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.3px;
  }
  .header-spacer { width: 64px; }

  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 8px 16px 16px;
    overflow-y: auto;
    overflow-x: hidden;
  }

  button { font-family: inherit; }
  button:focus-visible, .tile:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  .big-btn {
    min-height: 72px;
    border: none;
    border-radius: 999px;
    background: var(--gold);
    color: var(--text-on-gold);
    font-size: 24px;
    font-weight: 900;
    padding: 14px 28px;
    cursor: pointer;
    transition: transform 0.08s;
  }
  .big-btn:active { transform: scale(0.96); }
  .big-btn.lilac { background: var(--lilac); color: var(--bg-deep); }

  /* ---------- profile select ---------- */
  .brand {
    text-align: center;
    font-size: 36px;
    font-weight: 900;
    margin: 24px 0 2px;
    text-wrap: balance;
  }
  .brand-sub { text-align: center; color: var(--text-soft); font-size: 17px; margin-bottom: 18px; }

  .tile-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
  .avatar-tile {
    width: 140px; height: 140px;
    border-radius: 26px;
    border: 5px solid var(--outline);
    background: var(--bg-panel);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text-bright);
    transition: transform 0.08s;
  }
  .avatar-tile:active { transform: scale(0.95); }
  .avatar-tile .face { font-size: 58px; line-height: 1; }
  .avatar-tile .name { font-size: 20px; font-weight: 900; margin-top: 6px; }
  .avatar-tile.add { border-style: dashed; color: var(--text-soft); }

  .new-agent-form { margin-top: 20px; display: flex; flex-direction: column; gap: 14px; }
  .new-agent-form label { color: var(--text-soft); font-size: 14px; }
  .new-agent-form input {
    background: var(--bg-panel);
    border: 3px solid var(--outline);
    border-radius: 18px;
    color: var(--text-bright);
    font-size: 24px;
    font-weight: 800;
    font-family: inherit;
    padding: 14px 16px;
    width: 100%;
  }
  .avatar-pick-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .avatar-pick {
    width: 64px; height: 64px;
    font-size: 34px;
    border-radius: 999px;
    border: 4px solid transparent;
    background: var(--bg-raised);
    cursor: pointer;
  }
  .avatar-pick.picked { border-color: var(--gold); }

  /* ---------- HQ ---------- */
  .desk {
    display: flex; align-items: center; gap: 14px;
    background: var(--bg-panel);
    border-radius: 26px;
    padding: 16px 18px;
    margin-top: 4px;
  }
  .desk .spy { font-size: 52px; }
  .desk .agent { font-size: 24px; font-weight: 900; }
  .desk .rank { color: var(--gold); font-size: 16px; font-weight: 800; margin-top: 2px; }

  .doors {
    flex: 1;
    display: flex; flex-wrap: wrap;
    justify-content: center; align-content: center;
    gap: 16px;
    padding: 16px 0;
  }
  .door {
    width: 145px; height: 160px;
    border-radius: 26px;
    border: 5px solid;
    background: var(--bg-panel);
    color: var(--text-bright);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
    cursor: pointer;
    transition: transform 0.08s;
  }
  .door:active { transform: scale(0.95); }
  .door .icon { font-size: 54px; line-height: 1; }
  .door .label { font-size: 17px; font-weight: 900; }

  .hq-footer { display: flex; justify-content: flex-end; }
  .gate-btn {
    width: 64px; height: 64px;
    border: none; background: none;
    font-size: 22px; opacity: 0.45;
    cursor: pointer;
    border-radius: 999px;
    position: relative;
  }
  .gate-btn.holding::after {
    content: "";
    position: absolute; inset: 4px;
    border-radius: 999px;
    border: 3px solid var(--gold);
    animation: gate-pulse 3s linear forwards;
  }
  @keyframes gate-pulse { from { opacity: 0.2; } to { opacity: 1; transform: scale(1.25); } }

  /* ---------- mission map ---------- */
  .map-path { display: flex; flex-direction: column; gap: 18px; padding: 10px 4px 24px; }
  .map-row { width: 72%; }
  .map-row.left  { align-self: flex-start; }
  .map-row.right { align-self: flex-end; }
  .node {
    width: 100%;
    border-radius: 26px;
    border: 5px solid var(--gold);
    background: var(--bg-panel);
    color: var(--text-bright);
    padding: 14px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer;
  }
  .node .icon { font-size: 44px; line-height: 1; }
  .node .title { font-size: 17px; font-weight: 900; text-align: center; }
  .node .stamps { font-size: 18px; }
  .node.done   { border-color: var(--mint); opacity: 0.92; }
  .node.locked { border-color: var(--outline); opacity: 0.55; }
  .node.daily  { border-color: var(--lilac); }
  .node.pulse  { animation: node-pulse 1.4s ease-in-out infinite; }
  @keyframes node-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .daily-tag { color: var(--lilac); font-weight: 900; font-size: 12px; letter-spacing: 2.5px; }
  .limit-banner {
    background: var(--bg-panel);
    border-radius: 18px;
    padding: 14px;
    color: var(--text-soft);
    text-align: center;
    font-size: 16px;
  }

  /* ---------- briefing / stage ---------- */
  .scene {
    flex: 1;
    min-height: 160px;
    background: var(--bg-panel);
    border-radius: 26px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    margin-bottom: 14px;
    padding: 12px;
  }
  .scroll-world .scene { background: var(--scroll-panel); }
  .scene .hero { font-size: 100px; line-height: 1; }
  .scene .art-big {
    font-size: clamp(52px, 18vw, 88px);
    font-weight: 900;
    text-align: center;
    line-height: 1.15;
    word-spacing: 8px;
  }
  .count-grid {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 6px; max-width: 320px; font-size: 42px;
  }
  .legend {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px;
    background: var(--bg-raised);
    border-radius: 18px;
    padding: 8px 14px;
    font-size: 24px; font-weight: 900;
    color: var(--gold);
  }
  .scroll-world .legend { background: rgba(0,0,0,0.25); }
  .seq-row { display: flex; gap: 8px; }
  .seq-box {
    width: 50px; height: 50px;
    border-radius: 12px;
    border: 3px solid var(--outline);
    background: rgba(0,0,0,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 900; color: var(--mint);
  }
  .seq-box.done { border-color: var(--mint); background: var(--bg-raised); }

  .prompt-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .spy-face {
    flex: none;
    width: 74px; height: 74px;
    border-radius: 999px;
    border: 3px solid var(--gold);
    background: var(--bg-raised);
    font-size: 38px;
    cursor: pointer;
    position: relative;
  }
  .spy-face::after {
    content: "🔊";
    position: absolute; right: -4px; bottom: -4px;
    font-size: 15px;
    background: var(--gold);
    border-radius: 999px;
    padding: 2px 3px;
  }
  .prompt-caption {
    flex: 1;
    background: var(--bg-panel);
    border-radius: 18px;
    padding: 10px 14px;
    color: var(--text-soft);
    font-size: 14px;
    font-weight: 600;
  }
  .scroll-world .prompt-caption { background: var(--scroll-panel); }

  .pips { display: flex; justify-content: center; gap: 10px; margin: 2px 0 10px; }
  .pip { width: 15px; height: 15px; border-radius: 999px; background: var(--bg-raised); }
  .pip.done { background: var(--mint); }
  .pip.now  { background: var(--gold); }

  .options { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; padding: 8px 0 4px; }
  .tile {
    min-width: 86px; min-height: 86px;
    padding: 8px 18px;
    border-radius: 22px;
    border: 4px solid var(--outline);
    background: var(--bg-raised);
    color: var(--text-bright);
    font-size: 42px;
    font-weight: 900;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: transform 0.08s;
  }
  .tile:active { transform: scale(0.93); }
  .tile .mini { font-size: 26px; }
  .tile.word { font-size: 30px; min-width: 128px; }
  .tile.hebrew { font-size: 48px; }
  .tile.shake { animation: shake 0.4s; border-color: var(--coral); }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    15% { transform: translateX(9px); } 35% { transform: translateX(-9px); }
    55% { transform: translateX(6px); } 75% { transform: translateX(-5px); }
  }
  .tile.glow {
    border-color: var(--gold);
    box-shadow: 0 0 18px 4px rgba(255, 201, 77, 0.55);
    animation: glow 1s ease-in-out infinite;
  }
  @keyframes glow {
    0%,100% { box-shadow: 0 0 10px 2px rgba(255,201,77,0.35); }
    50%     { box-shadow: 0 0 22px 7px rgba(255,201,77,0.75); }
  }
  .tile.right { border-color: var(--mint); background: #234d3f; }

  /* ---------- vault ---------- */
  .vault-frame {
    position: relative;
    height: 300px;
    border-radius: 26px;
    overflow: hidden;
    background: #0e1430;
    margin: auto 0;
  }
  .vault-door {
    position: absolute; top: 0; bottom: 0; width: 50%;
    background: var(--bg-raised);
    border: 4px solid var(--gold);
  }
  .scroll-world .vault-door { background: var(--scroll-panel); border-color: var(--parchment); }
  .vault-door.l { left: 0; }
  .vault-door.r { right: 0; }
  .vault-wheel {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 86px;
  }
  .vault.opening .vault-wheel { animation: wheel-spin 1.4s ease-in-out forwards; }
  .vault.opening .vault-door.l { animation: door-l 0.9s ease-in 1.4s forwards; }
  .vault.opening .vault-door.r { animation: door-r 0.9s ease-in 1.4s forwards; }
  @keyframes wheel-spin { to { transform: rotate(720deg); opacity: 0; } }
  @keyframes door-l { to { transform: translateX(-105%); } }
  @keyframes door-r { to { transform: translateX(105%); } }

  .secret-card {
    background: var(--bg-panel);
    border: 4px solid var(--gold);
    border-radius: 26px;
    padding: 24px 20px;
    text-align: center;
    margin: auto 0;
    animation: pop-in 0.45s cubic-bezier(0.2, 1.4, 0.4, 1);
  }
  .secret-card.scroll { background: var(--parchment); border-color: var(--gold-deep); color: var(--parchment-ink); }
  .secret-card .emblem { font-size: 52px; }
  .secret-card .msg { font-size: 22px; font-weight: 700; line-height: 1.5; margin-top: 10px; text-wrap: balance; }
  @keyframes pop-in { from { transform: scale(0.7); opacity: 0; } }

  .confetti-bit { position: absolute; top: -40px; font-size: 24px; animation: fall linear forwards; pointer-events: none; z-index: 5; }
  @keyframes fall { to { transform: translateY(110dvh) rotate(360deg); } }

  /* ---------- debrief ---------- */
  .debrief { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
  .debrief h2 { font-size: 30px; font-weight: 900; margin: 0; }
  .debrief .stars { font-size: 40px; letter-spacing: 4px; }
  .reward-card {
    width: 90%;
    background: var(--bg-panel);
    border: 4px solid var(--sky);
    border-radius: 26px;
    padding: 18px;
    animation: pop-in 0.45s cubic-bezier(0.2, 1.4, 0.4, 1);
  }
  .reward-card .icon { font-size: 62px; }
  .reward-card .name { font-size: 20px; font-weight: 900; margin-top: 6px; }
  .badge-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .badge-chip {
    background: var(--bg-raised);
    border-radius: 18px;
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 800;
    color: var(--gold);
  }
  .ceremony { font-size: 42px; font-weight: 900; color: var(--gold); letter-spacing: 5px; }
  .ceremony-rank { font-size: 26px; font-weight: 800; }
  .ceremony-medal { font-size: 96px; animation: pop-in 0.6s cubic-bezier(0.2, 1.4, 0.4, 1); }

  /* ---------- locker & badges ---------- */
  .locker-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding: 8px 0; }
  .gadget {
    width: 140px; height: 130px;
    border-radius: 24px;
    border: 4px solid var(--sky);
    background: var(--bg-panel);
    color: var(--text-bright);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; padding: 6px;
    cursor: pointer;
  }
  .gadget .icon { font-size: 46px; line-height: 1; }
  .gadget .name { font-size: 13px; font-weight: 800; text-align: center; }
  .gadget.locked { border-color: var(--outline); opacity: 0.4; }
  .gadget.wiggle { animation: wiggle 0.5s; }
  @keyframes wiggle {
    0%,100% { transform: rotate(0); }
    20% { transform: rotate(10deg); } 45% { transform: rotate(-9deg); } 70% { transform: rotate(6deg); }
  }

  .id-card {
    background: var(--bg-panel);
    border: 5px solid var(--gold);
    border-radius: 26px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .id-card .eyebrow { color: var(--gold); font-size: 12px; font-weight: 900; letter-spacing: 2.5px; }
  .id-card .row { display: flex; align-items: center; gap: 16px; margin-top: 10px; }
  .id-card .avatar { font-size: 62px; }
  .id-card .name { font-size: 28px; font-weight: 900; }
  .id-card .rank { color: var(--gold); font-weight: 800; }
  .id-card .meta { color: var(--text-soft); margin-top: 4px; font-size: 16px; }
  .badge-wall { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .badge-slot {
    width: 100px;
    background: var(--bg-panel);
    border-radius: 18px;
    padding: 12px 6px;
    text-align: center;
  }
  .badge-slot .icon { font-size: 36px; }
  .badge-slot .name { font-size: 12.5px; font-weight: 700; margin-top: 6px; }
  .badge-slot.locked { opacity: 0.35; }

  /* ---------- parent ---------- */
  .modal-backdrop {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.72);
    display: flex; align-items: center; justify-content: center;
    z-index: 20;
  }
  .modal-card {
    background: var(--bg-panel);
    border-radius: 26px;
    padding: 26px 22px;
    width: 86%;
    text-align: center;
  }
  .modal-card h3 { margin: 0 0 14px; font-size: 22px; }
  .answer-row { display: flex; justify-content: center; gap: 12px; }
  .answer-btn {
    min-width: 76px; min-height: 64px;
    border-radius: 18px;
    border: none;
    background: var(--bg-raised);
    color: var(--text-bright);
    font-size: 30px; font-weight: 900;
    cursor: pointer;
  }
  .modal-cancel { background: none; border: none; color: var(--text-soft); font-size: 16px; margin-top: 18px; cursor: pointer; padding: 10px; }
  .modal-wrong { color: var(--coral); font-size: 15px; margin: 0 0 10px; }

  .parent-section {
    background: var(--bg-panel);
    border-radius: 22px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .parent-section h3 { color: var(--gold); font-size: 16px; margin: 0 0 10px; }
  .parent-section p { font-size: 16px; line-height: 1.55; margin: 0 0 8px; }
  .parent-section p.soft { color: var(--text-soft); font-size: 14px; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .switch {
    flex: none;
    width: 62px; height: 36px;
    border-radius: 999px;
    border: none;
    background: var(--bg-raised);
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
  }
  .switch::after {
    content: "";
    position: absolute; top: 4px; left: 4px;
    width: 28px; height: 28px;
    border-radius: 999px;
    background: var(--text-soft);
    transition: left 0.2s, background 0.2s;
  }
  .switch.on { background: var(--gold); }
  .switch.on::after { left: 30px; background: #fff; }
  .choice-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .choice {
    min-height: 48px;
    padding: 8px 18px;
    border-radius: 999px;
    border: none;
    background: var(--bg-raised);
    color: var(--text-bright);
    font-size: 16px; font-weight: 800;
    cursor: pointer;
  }
  .choice.on { background: var(--gold); color: var(--text-on-gold); }

  .check-flash {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 96px;
    pointer-events: none;
    animation: pop-in 0.35s;
    z-index: 4;
  }

  @media (prefers-reduced-motion: reduce) {
    .node.pulse, .tile.glow { animation: none; }
    .vault.opening .vault-wheel { animation-duration: 0.3s; }
    .vault.opening .vault-door.l, .vault.opening .vault-door.r { animation-duration: 0.3s; animation-delay: 0.35s; }
    .confetti-bit { display: none; }
  }
</style>

<div id="app"></div>

/* =============================== audio =============================== */

let wrongIdx = 0, correctIdx = 0;
function say(line) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(line);
    u.rate = 0.92;
    u.lang = "en-US";
    speechSynthesis.speak(u);
  } catch {}
}
const hush = () => { try { speechSynthesis.cancel(); } catch {} };

let audioCtx = null;
function blip(kind) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const make = (freq, start, dur, gainV) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0, t + start);
      g.gain.linearRampToValueAtTime(gainV, t + start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + start + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t + start); o.stop(t + start + dur + 0.05);
    };
    if (kind === "right") { make(660, 0, 0.16, 0.18); make(880, 0.13, 0.22, 0.18); }
    else if (kind === "tick") { make(740, 0, 0.1, 0.12); }
    else { make(180, 0, 0.25, 0.2); }
  } catch {}
}

function makeNameCodePuzzle(profile, st, variant) {
  const name = (profile.name.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 8)) || "AGENT";
  const letters = name.split("");
  const support = Math.max(1, st.notch + (variant > 0 ? 1 : 0));
  const pool = "BDGKMOPRSTW".split("").filter((c) => !letters.includes(c));
  const keypad = [...new Set([...letters, ...pool.slice(0, Math.min(3, 2 + st.notch))])].sort();
  const art =
    support === 1 ? { kind: "emoji", value: name }
    : support === 2 ? { kind: "emoji", value: letters[0] + " " + "▢ ".repeat(letters.length - 1).trim() }
    : { kind: "emoji", value: "🪪" };
  return {
    id: "@name_code_" + variant,
    templateKey: "name_code", rank: st.rank, notch: st.notch, track: "core",
    payload: {
      promptLine: "Agent " + profile.name + ", code in your name. Press your letters in order!",
      hintLine: "Your name starts with " + letters[0] + ". Say your name slowly and listen for each letter.",
      art,
      options: keypad.map((l) => ({ id: l, label: l })),
      answer: letters,
    },
  };
}

function resolveMissionPuzzles(mission, profile, st) {
  let n = 0;
  return mission.puzzleIdsByNotch[st.notch].map((id) =>
    id === "@name_code" ? makeNameCodePuzzle(profile, st, n++) : puzzleById(id),
  );
}

function hashString(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const todayKey = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
};

function makeDailyMission(profile, st) {
  const day = todayKey();
  let seed = hashString(day + ":" + profile.id);
  const seen = new Set();
  const pool = [];
  for (const notch of [st.notch, 2, 1]) {
    for (const p of CONTENT.puzzles) {
      if (p.rank === st.rank && p.track === "core" && p.notch === notch && !seen.has(p.id)) {
        seen.add(p.id); pool.push(p);
      }
    }
  }
  for (let i = pool.length - 1; i > 0; i--) {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    const j = seed % (i + 1);
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const ids = pool.slice(0, 3).map((p) => p.id);
  return {
    id: "daily_" + day, title: "Daily Drop", rank: st.rank, track: "core", icon: "📬",
    briefingLine: "Fresh orders just arrived, Agent! A brand new drop, today only. Ready for it?",
    debriefLine: "Daily drop complete. Same time tomorrow, Agent — headquarters never sleeps. Well, it naps. Spymaster out!",
    secretMessageLine: "Today's secret message: EVERY DAY YOU PRACTICE, YOUR AGENT POWERS GROW.",
    gadgetRewardId: "g_radio",
    puzzleIdsByNotch: { 1: ids, 2: ids, 3: ids },
  };
}

/* Adaptive rules, identical to the app: 3 first-tries in a row raise the
   notch, two glow stages in one mission lower it, clean notch-3 twice in a
   row promotes. Never shown to the child except the ceremony. */
function applyMissionResults(st, results) {
  const playedAtNotch = st.notch;
  let promotedTo = null;
  const glows = results.filter((r) => r.glowed).length;

  if (!st.difficultyLocked) {
    for (const r of results) {
      st.adaptive.streak = r.firstTry ? st.adaptive.streak + 1 : 0;
      if (st.adaptive.streak >= 3 && st.notch < 3) { st.notch += 1; st.adaptive.streak = 0; }
    }
    if (glows >= 2 && st.notch > 1) { st.notch -= 1; st.adaptive.streak = 0; }
  }

  if (playedAtNotch === 3 && st.notch === 3 && glows === 0) st.adaptive.notch3Streak += 1;
  else st.adaptive.notch3Streak = 0;

  const ri = RANK_ORDER.indexOf(st.rank);
  if (st.adaptive.notch3Streak >= 2 && ri < RANK_ORDER.length - 1) {
    promotedTo = RANK_ORDER[ri + 1];
    st.rank = promotedTo;
    st.adaptive.notch3Streak = 0;
    st.adaptive.streak = 0;
    st.notch = 1;
  }
  return promotedTo;
}

const stampsFor = (results) => Math.max(1, 3 - results.filter((r) => r.glowed).length);

function completeMission(profile, st, mission, results) {
  const stamps = stampsFor(results);
  const prev = st.progress[mission.id];
  st.progress[mission.id] = { stamps: Math.max(stamps, prev ? prev.stamps : 0), at: Date.now() };
  if (!st.gadgets.includes(mission.gadgetRewardId)) st.gadgets.push(mission.gadgetRewardId);

  const promotedTo = applyMissionResults(st, results);

  const newBadges = [];
  const award = (id, cond) => {
    if (cond && !st.badges.includes(id)) { st.badges.push(id); newBadges.push(id); }
  };
  const total = Object.keys(st.progress).length;
  award("b_first_mission", total >= 1);
  award("b_three_missions", total >= 3);
  award("b_first_scroll", mission.track === "scroll");
  award("b_daily_streak", mission.id.startsWith("daily_"));
  award("b_promotion", promotedTo !== null);
  award("b_sharp_ears", mission.id === "m_squeaky_door" && results.every((r) => r.firstTry));
  award("b_all_recruit", missionsFor("recruit", "core").every((m) => st.progress[m.id]));

  saveState(profile.id, st);
  return { stamps, promotedTo, newBadges };
}

    + '<div class="tile-grid">'
    + profiles.map((p) =>
        '<button class="avatar-tile" data-enter="' + p.id + '"><span class="face">' + avatarFor(p.avatarId).emoji + '</span><span class="name">' + esc(p.name) + "</span></button>"
      ).join("")
    + (!adding && profiles.length < 6 ? '<button class="avatar-tile add" data-act="add"><span class="face">➕</span><span class="name">New Agent</span></button>' : "")
    + "</div>"
    + (adding
      ? '<div class="new-agent-form">'
        + "<label>New agent's name (a grown-up types this once):</label>"
        + '<input id="new-name" maxlength="12" placeholder="Agent name" autocomplete="off">'
        + '<div class="avatar-pick-row">'
        + AVATARS.map((a, i) => '<button class="avatar-pick' + (i === 0 ? " picked" : "") + '" data-avatar="' + a.id + '">' + a.emoji + "</button>").join("")
        + "</div>"
        + '<button class="big-btn" data-act="create">🎖️ Join the Academy</button>'
        + "</div>"
      : "")
    + "</div>",
  );

  let pickedAvatar = AVATARS[0].id;
  app.querySelectorAll("[data-avatar]").forEach((b) =>
    b.addEventListener("click", () => {
      pickedAvatar = b.dataset.avatar;
      app.querySelectorAll("[data-avatar]").forEach((x) => x.classList.toggle("picked", x === b));
    }),
  );
  app.querySelectorAll("[data-enter]").forEach((b) =>
    b.addEventListener("click", () => {
      const p = listProfiles().find((x) => x.id === b.dataset.enter);
      current.profile = p;
      current.st = stateFor(p.id);
      current.missionsThisSession = 0;
      say("Agent " + p.name + ", welcome back to headquarters!");
      showHQ();
    }),
  );
  const addBtn = app.querySelector('[data-act="add"]');
  if (addBtn) addBtn.addEventListener("click", () => showProfileSelect(true));
  const createBtn = app.querySelector('[data-act="create"]');
  if (createBtn) createBtn.addEventListener("click", () => {
    const name = app.querySelector("#new-name").value.trim();
    if (!name) return;
    const p = { id: Date.now().toString(36), name, avatarId: pickedAvatar };
    saveProfiles([...listProfiles(), p]);
    showProfileSelect();
  });
}

/* ---------- HQ ---------- */

function showHQ() {
  const p = current.profile, st = current.st;
  render(
    header("", "toProfiles")
    + '<div class="body">'
    + '<div class="desk"><span class="spy">🕵️</span><div><div class="agent">Agent ' + esc(p.name) + '</div><div class="rank">' + RANK_LABELS[st.rank] + "</div></div></div>"
    + '<div class="doors">'
    + door("missions", "🗺️", "Missions", "var(--gold)")
    + door("locker", "🧰", "Gadget Locker", "var(--sky)")
    + door("badges", "🏅", "Badge Wall", "var(--mint)")
    + (st.scrollRoom ? door("scroll", "📜", "Scroll Room", "var(--parchment)") : "")
    + "</div>"
    + '<div class="hq-footer"><button class="gate-btn" id="gate" aria-label="Parent area (hold three seconds)">👤</button></div>'
    + "</div>",
  );
  say(CONTENT.lines.welcomeHQ);

  app.querySelector('[data-act="toProfiles"]').addEventListener("click", () => { hush(); showProfileSelect(); });
  app.querySelector('[data-door="missions"]').addEventListener("click", () => showMap("core"));
  app.querySelector('[data-door="locker"]').addEventListener("click", showLocker);
  app.querySelector('[data-door="badges"]').addEventListener("click", showBadges);
  const scrollDoor = app.querySelector('[data-door="scroll"]');
  if (scrollDoor) scrollDoor.addEventListener("click", () => showMap("scroll"));

  const gate = app.querySelector("#gate");
  let holdT = null;
  const start = (e) => {
    e.preventDefault();
    gate.classList.add("holding");
    holdT = setTimeout(() => { gate.classList.remove("holding"); showParentChallenge(); }, 3000);
  };
  const stop = () => { gate.classList.remove("holding"); if (holdT) clearTimeout(holdT); holdT = null; };
  gate.addEventListener("pointerdown", start);
  gate.addEventListener("pointerup", stop);
  gate.addEventListener("pointerleave", stop);
}

const door = (id, icon, label, color) =>
  '<button class="door" data-door="' + id + '" style="border-color:' + color + '"><span class="icon">' + icon + '</span><span class="label">' + label + "</span></button>";

/* ---------- parent gate ---------- */

function showParentChallenge() {
  const wrap = document.createElement("div");
  wrap.className = "modal-backdrop";
  wrap.innerHTML =
    '<div class="modal-card"><h3>Grown-ups only: 6 × 4 = ?</h3><p class="modal-wrong" style="visibility:hidden">Not quite — try again.</p>'
    + '<div class="answer-row">' + [18, 24, 32].map((n) => '<button class="answer-btn" data-n="' + n + '">' + n + "</button>").join("") + "</div>"
    + '<button class="modal-cancel">Cancel</button></div>';
  app.appendChild(wrap);
  wrap.querySelector(".modal-cancel").addEventListener("click", () => wrap.remove());
  wrap.querySelectorAll(".answer-btn").forEach((b) =>
    b.addEventListener("click", () => {
      if (b.dataset.n === "24") { wrap.remove(); showParentArea(); }
      else wrap.querySelector(".modal-wrong").style.visibility = "visible";
    }),
  );
}

function showParentArea() {
  const p = current.profile, st = current.st;
  const done = Object.keys(st.progress).length;
  const scrollDone = CONTENT.missions.filter((m) => m.track === "scroll" && st.progress[m.id]).length;
  render(
    header("Parent Area", "toHQ")
    + '<div class="body">'
    + '<div class="parent-section"><h3>' + esc(p.name) + "'s progress</h3>"
    + "<p>" + esc(p.name) + " is a " + RANK_LABELS[st.rank] + " working at level " + st.notch + " of 3"
    + (st.difficultyLocked ? " (held there by you)" : " (adjusting automatically)") + ".</p>"
    + "<p>Missions completed: " + done + (st.scrollRoom ? " — including " + scrollDone + " scroll " + (scrollDone === 1 ? "mission" : "missions") + "." : ".") + "</p>"
    + '<p class="soft">The game quietly raises the level after three first-try answers in a row, and lowers it if a mission needed two glowing hints. ' + esc(p.name) + " only ever sees the promotion ceremony.</p></div>"

    + '<div class="parent-section"><h3>Scroll Room</h3><div class="switch-row"><p>Unlock the Scroll Room (scroll missions with Hebrew letters and a verse as each reward)</p>'
    + '<button class="switch' + (st.scrollRoom ? " on" : "") + '" id="sw-scroll" role="switch" aria-checked="' + st.scrollRoom + '"></button></div></div>'

    + '<div class="parent-section"><h3>Missions per session</h3><div class="choice-row">'
    + [0, 1, 2, 3].map((n) => '<button class="choice' + (st.missionsPerSession === n ? " on" : "") + '" data-limit="' + n + '">' + (n === 0 ? "No limit" : n) + "</button>").join("")
    + "</div></div>"

    + '<div class="parent-section"><h3>Difficulty override</h3><div class="switch-row"><p>Hold the level steady (stop automatic adjustment)</p>'
    + '<button class="switch' + (st.difficultyLocked ? " on" : "") + '" id="sw-lock" role="switch" aria-checked="' + st.difficultyLocked + '"></button></div>'
    + '<div class="choice-row">' + [1, 2, 3].map((n) => '<button class="choice' + (st.notch === n ? " on" : "") + '" data-notch="' + n + '">Level ' + n + "</button>").join("") + "</div></div>"

    + '<div class="parent-section"><h3>Secret voice messages</h3><p class="soft">Recording a message in your own voice (played as a “secret transmission” after a mission) is available in the phone app version — browsers in this preview keep the microphone off.</p></div>'
    + "</div>",
  );
  app.querySelector('[data-act="toHQ"]').addEventListener("click", showHQ);
  const save = () => saveState(p.id, st);
  app.querySelector("#sw-scroll").addEventListener("click", () => { st.scrollRoom = !st.scrollRoom; save(); showParentArea(); });
  app.querySelector("#sw-lock").addEventListener("click", () => { st.difficultyLocked = !st.difficultyLocked; save(); showParentArea(); });
  app.querySelectorAll("[data-limit]").forEach((b) => b.addEventListener("click", () => { st.missionsPerSession = +b.dataset.limit; save(); showParentArea(); }));
  app.querySelectorAll("[data-notch]").forEach((b) => b.addEventListener("click", () => { st.notch = +b.dataset.notch; save(); showParentArea(); }));
}

/* ---------- mission map ---------- */

function showMap(track) {
  const p = current.profile, st = current.st;
  const missions = missionsFor(st.rank, track);
  const limitHit = st.missionsPerSession > 0 && current.missionsThisSession >= st.missionsPerSession;

  let unlocked = true;
  const nodes = missions.map((m) => {
    const row = st.progress[m.id];
    if (row) return { m, status: "done", stamps: row.stamps };
    const status = unlocked ? "open" : "locked";
    unlocked = false;
    return { m, status, stamps: 0 };
  });
  if (track === "core") {
    const daily = makeDailyMission(p, st);
    const row = st.progress[daily.id];
    nodes.push({ m: daily, status: row ? "done" : "open", stamps: row ? row.stamps : 0, daily: true });
  }

  render(
    header(track === "scroll" ? "📜 Scroll Room" : "🗺️ Missions", "toHQ")
    + '<div class="body"><div class="map-path">'
    + (limitHit ? '<div class="limit-banner">🌙 All missions done for now. See you next time, Agent!</div>' : "")
    + nodes.map((n, i) =>
        '<div class="map-row ' + (i % 2 ? "right" : "left") + '">'
        + '<button class="node ' + (n.status === "done" ? "done" : n.status === "locked" ? "locked" : "pulse")
        + (n.daily ? " daily" : "") + '"' + (limitHit ? ' style="opacity:0.45"' : "") + ' data-node="' + i + '">'
        + '<span class="icon">' + (n.status === "locked" ? "🔒" : n.m.icon) + "</span>"
        + '<span class="title">' + esc(n.m.title) + "</span>"
        + (n.status === "done" ? '<span class="stamps">' + "⭐".repeat(n.stamps) + "</span>" : "")
        + (n.daily && n.status !== "done" ? '<span class="daily-tag">TODAY</span>' : "")
        + "</button></div>"
      ).join("")
    + "</div></div>",
    { scrollWorld: track === "scroll" },
  );
  app.querySelector('[data-act="toHQ"]').addEventListener("click", () => { hush(); showHQ(); });
  app.querySelectorAll("[data-node]").forEach((b) =>
    b.addEventListener("click", () => {
      const n = nodes[+b.dataset.node];
      if (n.status === "locked") { say("That door is still locked, Agent. Finish the missions before it!"); return; }
      if (limitHit) { say(CONTENT.lines.sessionDone); return; }
      showBriefing(n.m);
    }),
  );
}

/* ---------- briefing ---------- */

function showBriefing(mission) {
  render(
    header(mission.title, "toMap")
    + '<div class="body">'
    + '<div class="scene"><span class="hero">' + mission.icon + "</span></div>"
    + '<div class="prompt-row"><button class="spy-face" id="replay">🕵️</button><div class="prompt-caption">Tap the Spymaster to hear the briefing again</div></div>'
    + '<button class="big-btn" id="accept">🫡 Accept Mission</button>'
    + "</div>",
    { scrollWorld: mission.track === "scroll" },
  );
  say(mission.briefingLine);
  app.querySelector('[data-act="toMap"]').addEventListener("click", () => { hush(); showMap(mission.track); });
  app.querySelector("#replay").addEventListener("click", () => say(mission.briefingLine));
  app.querySelector("#accept").addEventListener("click", () => { hush(); startMission(mission); });
}

/* ---------- code stage ---------- */

function startMission(mission) {
  const puzzles = resolveMissionPuzzles(mission, current.profile, current.st);
  runStage(mission, puzzles, 0, []);
}

function runStage(mission, puzzles, stageIndex, results) {
  const puzzle = puzzles[stageIndex];
  const payload = puzzle.payload;
  const template = templateByKey(puzzle.templateKey);
  const answerSeq = Array.isArray(payload.answer) ? payload.answer : [payload.answer];
  const isScroll = mission.track === "scroll";
  const isHebrew = puzzle.templateKey.indexOf("aleph") === 0 || puzzle.templateKey.indexOf("hebrew") === 0 || puzzle.templateKey === "gematria";

  let misses = 0, seqPos = 0, everGlowed = false, clean = true, solved = false;

  const artHtml = payload.art
    ? (payload.art.count
        ? '<div class="count-grid">' + Array.from({ length: payload.art.count }, () => "<span>" + payload.art.value + "</span>").join("") + "</div>"
        : '<div class="art-big">' + esc(payload.art.value) + "</div>")
    : "";
  const legendHtml = payload.legend
    ? '<div class="legend">' + payload.legend.map((l) => "<span>" + esc(l.symbol) + " = " + esc(l.means) + "</span>").join("") + "</div>"
    : "";
  const seqHtml = template.mode === "sequence"
    ? '<div class="seq-row">' + answerSeq.map(() => '<div class="seq-box"></div>').join("") + "</div>"
    : "";

  render(
    header(mission.title, "quit")
    + '<div class="body">'
    + '<div class="pips">' + puzzles.map((_, i) =>
        '<span class="pip' + (i < stageIndex ? " done" : i === stageIndex ? " now" : "") + '"></span>').join("") + "</div>"
    + '<div class="scene">' + artHtml + legendHtml + seqHtml + "</div>"
    + '<div class="prompt-row"><button class="spy-face" id="replay">🕵️</button><div class="prompt-caption">Tap the Spymaster to hear it again</div></div>'
    + '<div class="options">'
    + payload.options.map((o, i) =>
        '<button class="tile' + (puzzle.templateKey === "sight_word" ? " word" : "") + (isHebrew ? " hebrew" : "") + '" data-opt="' + i + '">'
        + (o.emoji ? '<span class="mini">' + o.emoji + "</span>" : "")
        + esc(o.label) + "</button>").join("")
    + "</div></div>",
    { scrollWorld: isScroll },
  );

  say(payload.promptLine);

  app.querySelector('[data-act="quit"]').addEventListener("click", () => { hush(); showHQ(); });
  app.querySelector("#replay").addEventListener("click", () => say(payload.promptLine));

  const tiles = [...app.querySelectorAll("[data-opt]")];
  const seqBoxes = [...app.querySelectorAll(".seq-box")];

  const setGlow = () => {
    const expected = answerSeq[seqPos];
    tiles.forEach((t) => {
      const o = payload.options[+t.dataset.opt];
      t.classList.toggle("glow", o.id === expected);
    });
  };

  tiles.forEach((t) =>
    t.addEventListener("click", () => {
      if (solved) return;
      const o = payload.options[+t.dataset.opt];
      const expected = answerSeq[seqPos];

      if (o.id !== expected) {
        clean = false;
        misses += 1;
        blip("wrong");
        t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake");
        if (misses === 1) say(nextWrong());
        else if (misses === 2) say(payload.hintLine);
        else { everGlowed = true; say(CONTENT.lines.glowNudge); setGlow(); }
        return;
      }

      // right tap
      tiles.forEach((x) => x.classList.remove("glow"));
      if (seqPos + 1 < answerSeq.length) {
        blip("tick");
        seqBoxes[seqPos].classList.add("done");
        seqBoxes[seqPos].textContent = o.label;
        seqPos += 1;
        misses = 0;
        if (everGlowed) setGlow();
        return;
      }

      solved = true;
      blip("right");
      if (seqBoxes[seqPos]) { seqBoxes[seqPos].classList.add("done"); seqBoxes[seqPos].textContent = o.label; }
      t.classList.add("right");
      say(nextCorrect());
      const flash = document.createElement("div");
      flash.className = "check-flash";
      flash.textContent = "✅";
      app.appendChild(flash);

      const result = { firstTry: clean && !everGlowed, glowed: everGlowed };
      setTimeout(() => {
        const all = [...results, result];
        if (stageIndex + 1 < puzzles.length) runStage(mission, puzzles, stageIndex + 1, all);
        else showUnlock(mission, all);
      }, 1100);
    }),
  );
}

const nextWrong = () => CONTENT.lines.wrongTap[wrongIdx++ % CONTENT.lines.wrongTap.length];
const nextCorrect = () => CONTENT.lines.correctTap[correctIdx++ % CONTENT.lines.correctTap.length];

/* ---------- unlock ---------- */

function showUnlock(mission, results) {
  const isScroll = mission.track === "scroll";
  const outcome = completeMission(current.profile, current.st, mission, results);
  current.missionsThisSession += 1;

  render(
    '<div class="body">'
    + '<div class="vault opening" id="vault"><div class="vault-frame">'
    + '<div class="vault-door l"></div><div class="vault-door r"></div>'
    + '<div class="vault-wheel">' + (isScroll ? "📜" : "🛞") + "</div>"
    + "</div></div>"
    + '<div id="after" style="display:none; flex:1; display:none; flex-direction:column;">'
    + '<div class="secret-card' + (isScroll ? " scroll" : "") + '">'
    + '<div class="emblem">' + (isScroll ? "📜" : "💌") + "</div>"
    + '<div class="msg">' + esc(mission.secretMessageLine) + "</div></div>"
    + '<button class="big-btn" id="next" style="margin-top:18px">🫡 Report to the Spymaster</button>'
    + "</div></div>",
    { scrollWorld: isScroll },
  );

  say(CONTENT.lines.vaultOpening);

  setTimeout(() => {
    app.querySelector("#vault").style.display = "none";
    const after = app.querySelector("#after");
    after.style.display = "flex";
    confetti();
    say(mission.secretMessageLine);
    app.querySelector("#next").addEventListener("click", () => { hush(); showDebrief(mission, results, outcome); });
  }, 2400);
}

function confetti() {
  const bits = ["🎉", "⭐", "✨", "🎊", "💛", "💙"];
  for (let i = 0; i < 22; i++) {
    const el = document.createElement("span");
    el.className = "confetti-bit";
    el.textContent = bits[i % bits.length];
    el.style.left = ((i * 137) % 100) + "%";
    el.style.animationDuration = (2.2 + (i % 5) * 0.35) + "s";
    el.style.animationDelay = ((i % 7) * 0.12) + "s";
    app.appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }
}

/* ---------- debrief ---------- */

function showDebrief(mission, results, outcome) {
  const gadget = gadgetById(mission.gadgetRewardId);

  if (outcome.promotedTo) {
    render(
      '<div class="body"><div class="debrief">'
      + '<div class="ceremony-medal">🎖️</div>'
      + '<div class="ceremony">PROMOTED!</div>'
      + '<div class="ceremony-rank">' + RANK_LABELS[outcome.promotedTo] + "</div>"
      + '<button class="big-btn" id="onward">🫡 Stand tall, Agent</button>'
      + "</div></div>",
    );
    say(CONTENT.lines.promotion);
    app.querySelector("#onward").addEventListener("click", () => {
      showDebrief(mission, results, { ...outcome, promotedTo: null });
    });
    return;
  }

  render(
    '<div class="body"><div class="debrief">'
    + "<h2>Mission Accomplished!</h2>"
    + '<div class="stars">' + "⭐".repeat(outcome.stamps) + "</div>"
    + '<div class="reward-card"><div class="icon">' + gadget.emoji + '</div><div class="name">New gadget: ' + esc(gadget.name) + "</div></div>"
    + (outcome.newBadges.length
        ? '<div class="badge-chips">' + outcome.newBadges.map((id) => { const b = badgeById(id); return '<span class="badge-chip">' + b.emoji + " " + esc(b.name) + "</span>"; }).join("") + "</div>"
        : "")
    + '<button class="big-btn" id="home">🏠 Back to HQ</button>'
    + "</div></div>",
  );
  say(mission.debriefLine);
  app.querySelector("#home").addEventListener("click", () => { hush(); showHQ(); });
}

/* ---------- locker & badges ---------- */

function showLocker() {
  const st = current.st;
  render(
    header("🧰 Gadget Locker", "toHQ")
    + '<div class="body"><div class="locker-grid">'
    + CONTENT.gadgets.map((g) =>
        st.gadgets.includes(g.id)
          ? '<button class="gadget" data-g="' + g.id + '"><span class="icon">' + g.emoji + '</span><span class="name">' + esc(g.name) + "</span></button>"
          : '<div class="gadget locked"><span class="icon">❓</span></div>'
      ).join("")
    + "</div></div>",
  );
  app.querySelector('[data-act="toHQ"]').addEventListener("click", () => { hush(); showHQ(); });
  app.querySelectorAll("[data-g]").forEach((b) =>
    b.addEventListener("click", () => {
      const g = gadgetById(b.dataset.g);
      say(g.tapLine);
      b.classList.remove("wiggle"); void b.offsetWidth; b.classList.add("wiggle");
    }),
  );
}

function showBadges() {
  const p = current.profile, st = current.st;
  const done = Object.keys(st.progress).length;
  render(
    header("🏅 Badge Wall", "toHQ")
    + '<div class="body">'
    + '<div class="id-card"><div class="eyebrow">SPY ACADEMY · AGENT ID</div>'
    + '<div class="row"><span class="avatar">' + avatarFor(p.avatarId).emoji + "</span>"
    + '<div><div class="name">' + esc(p.name) + '</div><div class="rank">' + RANK_LABELS[st.rank] + "</div>"
    + '<div class="meta">Missions: ' + done + "&nbsp; " + "⭐".repeat(Math.min(5, done)) + "</div></div></div></div>"
    + '<div class="badge-wall">'
    + CONTENT.badges.map((b) => {
        const has = st.badges.includes(b.id);
        return '<div class="badge-slot' + (has ? "" : " locked") + '"><div class="icon">' + (has ? b.emoji : "🔒") + '</div><div class="name">' + esc(b.name) + "</div></div>";
      }).join("")
    + "</div></div>",
  );
  app.querySelector('[data-act="toHQ"]').addEventListener("click", () => { hush(); showHQ(); });
}

/* ---------- boot ---------- */
showProfileSelect();
</script>
